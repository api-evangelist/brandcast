server:
  name: brandcast
  description: >-
    Candidate MCP tool surface for the Brandcast API — programmatic Design
    Studio actions: list templates, create a website from a template, read and
    update website content, manage the media library, publish/unpublish and
    export websites, and configure Salesforce tracking.
  transport: null
  base_url: https://api.brandcast-prod.io/v1
authentication:
  type: api-key
  header: x-api-key
  note: >-
    Every operation requires an x-api-key header issued by Brandcast and tied
    to the developer's Brandcast account, sent over HTTPS. Three export
    operations additionally accept an Authorization JWT plus an x-account-id
    account-context header, documented as "only required when called by Design
    Studio".
