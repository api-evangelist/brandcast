corporate_lifecycle:
  note: >-
    Brandcast's website product was renamed "Sites" (briefly TIME Sites) and
    the business was acquired by Vev (vev.design, Norway). brandcast.com and
    timesites.com now both resolve to www.sites.design. The developer portal at
    developer.brandcast.io and the API host api.brandcast-prod.io remain live
    and un-migrated; the application login is still app.brandcast.io. No
    end-of-life notice for the API has been published.
