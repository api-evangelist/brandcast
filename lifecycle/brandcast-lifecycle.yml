status_page:
  brandcast_api: null
  note: >-
    Brandcast publishes no status page for api.brandcast-prod.io. Vev — which
    acquired the Sites product Brandcast became — runs an Atlassian Statuspage
    at https://status.vev.design/ (HTTP 200, probed 2026-08-13), but its
    components are Platform, Staging, Hosting & Publishing, Standard Hosting,
    www.vev.design, CDN, SFTP, FTP(S), Amazon S3, Webhook and Publishing. None
    covers the Brandcast API host. Recorded for context only; NO StatusPage
    pointer is emitted, because the Brandcast API's availability is not
    reported anywhere.
  related_operator_status_page: https://status.vev.design/
