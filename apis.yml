aid: brandcast
name: Brandcast
description: >-
  Brandcast is a no-code digital customer experience and website platform,
  founded in 2013 and backed by Shasta Ventures, that fuses web design,
  content creation, and brand asset management into a single system. Business
  and marketing teams use its Design Studio to build and maintain branded
  websites, sales proposals, brochures, and content programs, with Salesforce
  integration for personalized, trackable sites. The Brandcast API opens the
  Design Studio to developers to create websites from templates and update
  site content, authenticated with an API key sent in the x-api-key header
  over HTTPS. Brandcast's website product has since been rebranded as "Sites"
  and joined Vev; the developer API portal remains at developer.brandcast.io.
