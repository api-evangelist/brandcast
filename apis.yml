x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 21
  pass: local-v1
  note: >-
    Round 2. The prior round recorded "no OpenAPI/Swagger specification is
    published"; STEP 0b contract discovery overturned that — the Swagger UI on
    developer.brandcast.io names a discoveryUrl of
    https://s3.amazonaws.com/apidoc.brandcast-prod.io/resources.json, a live
    Swagger 1.2 resource listing with four API declarations and 26 operations,
    all with basePath https://api.brandcast-prod.io/v1. Saved verbatim to
    openapi/_original/ and converted to OpenAPI 3.1. Deliberately NOT wired:
    WellKnown/SecurityTxt (every path 404s, 403s, or soft-200s an SPA shell),
    AgentCard (no card served), MCPServer (no server ships — mcp/ holds a
    derived candidate with deployment.mode none), SDKs (no first-party client
    library exists), Idempotency (no idempotency key on any operation),
    StatusPage (status.vev.design covers Vev, not the Brandcast API),
    Deprecation (no policy; one deprecated parameter recorded in lifecycle),
    Compliance/TrustCenter (no certification claimed), Pricing (no pricing
    page; sites.design/pricing 404s).
