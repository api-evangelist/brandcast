apis:
- name: Brandcast API
  description: >-
    The Brandcast API lets developers programmatically perform Design Studio
    actions across 26 operations: list and read templates, create a website
    from a template, read and update website content, add or upload media via
    S3 presigned URLs, publish and unpublish sites as asynchronous jobs, export
    a publish as a ZIP, password-protect a site, and configure the Salesforce
    tracking that makes Brandcast sites personalized and trackable. Requests
    are authenticated with an API key in the x-api-key header, sent over HTTPS.
    The contract is published as Swagger 1.2 at
    s3.amazonaws.com/apidoc.brandcast-prod.io and rendered by Swagger UI 1.x on
    developer.brandcast.io; it has not changed since 2021-07-01.
  humanURL: https://developer.brandcast.io/
  baseURL: https://api.brandcast-prod.io
