note: >-
  Brandcast publishes NO pricing for the Brandcast API and no pricing page for
  the Sites product it became. The developer portal is a single page covering
  overview, endpoint and authentication with no commercial terms; API keys are
  "issued by Brandcast and tied to the developer's Brandcast account", i.e.
  provisioned by the vendor rather than self-served. The product site
  (brandcast.com, which serves www.sites.design) has no pricing link anywhere
  in its markup, and https://www.sites.design/pricing/ returns HTTP 404 — the
  site serves genuine 404s, so this is a real absence and not an SPA artifact.
  The only pricing on the wider surface belongs to Vev, the acquirer
  (https://www.vev.design/pricing/, HTTP 200), and covers Vev's own product,
  not the Brandcast API — it is deliberately NOT recorded as a Brandcast plan.
  The only commercial signal for Sites is a "Get a demo" call-to-action, i.e. a
  sales-gated motion. Accordingly no Pricing pointer is emitted in apis.yml.
