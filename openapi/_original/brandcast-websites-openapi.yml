openapi: 3.1.0
info:
  title: Brandcast Websites API
  version: 1.0.0
  description: Create, read, update, delete, publish, unpublish, export and password-protect Brandcast
    websites, and manage their content and media libraries.
  contact:
    name: Brandcast API
    url: https://developer.brandcast.io/
servers:
- url: https://api.brandcast-prod.io/v1
  description: Brandcast production API
externalDocs:
