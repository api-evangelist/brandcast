  /websites/{websiteId}/publish/{publishId}/export:
    post:
      summary: Export website
      description: Starts an export job which will ZIP up all HTML and assets for this publish and provide
        them for download via an S3 signed URL.  If the file name already exists, it will be modified
        like filename(1).
      operationId: createExportJob
      tags:
      - Websites
      parameters:
      - name: x-account-id
        in: header
        description: The account context for this action. Required when using Authorization header.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: A valid JWT. Only required when called by Design Studio.
        required: false
        schema:
          type: string
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      - name: publishId
        in: path
        description: An existing publish ID
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        description: The preferred name for the ZIP file.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /websites/{websiteId}/publish/{publishId}/export/{fileName}:
    get:
      summary: Get status of exporting a publish
      description: Returns information about exporting this publish, e.g., status, signed URL.  Calling
        this API will also refresh the signed URL.
      operationId: getExportJob
      tags:
      - Websites
      parameters:
      - name: x-account-id
        in: header
        description: The account context for this action. Required when using Authorization header.
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: A valid JWT. Only required when called by Design Studio.
        required: false
        schema:
          type: string
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      - name: publishId
        in: path
        description: An existing publish ID
        required: true
        schema:
          type: string
      - name: fileName
        in: path
        description: The name for the ZIP file.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
