          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /websites/{websiteId}/medialibrary:
    get:
      summary: Get website media library
      description: Returns website's media library.
      operationId: getWebsiteMediaLibrary
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add to website media library
      description: Supported media are video/youtube and video/vimeo. Subsequently, once the media has
        been added to S3, the media ID can be used to update content in the website.
      operationId: addToWebsiteMediaLibrary
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      requestBody:
        description: JSON body
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /websites/{websiteId}/medialibrary/upload:
    post:
      summary: Upload to website media library
      description: Returns a media ID for the media and an S3 presigned URL to upload the media content
        to. Supported media are images, video, PDFs, and ZIP files. Subsequently, once the media has been
        uploaded to S3, the media ID can be used to update content in the website.
      operationId: uploadToWebsiteMediaLibrary
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        description: Media file name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
