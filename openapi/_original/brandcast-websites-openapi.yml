          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /websites/{websiteId}/content/{contentId}:
    put:
      summary: Update website content
      description: Updates content for specified website. The JSON body depends on the type of content
        being updated (e.g., text, embed, images, video, etc.), which is known by getting the website's
        content.
      operationId: updateWebsiteContent
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      - name: contentId
        in: path
        description: Content ID
        required: true
        schema:
          type: string
      requestBody:
        description: JSON body
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
