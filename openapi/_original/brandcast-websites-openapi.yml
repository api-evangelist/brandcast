          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /websites/{websiteId}/content:
    get:
      summary: Get website content
      description: Returns content for specified website. Use the optional name parameter to filter content
        by name.
      operationId: getWebsiteContent
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Filters the result by name
        required: false
        schema:
          type: string
      - name: tags
        in: query
        description: Deprecated.  Optional comma delimited list of tags to filter content by
        required: false
        deprecated: true
        schema:
          type: string
      - name: filterLockedContent
        in: query
        description: Enables/Disables the Locked Content Filter.  Defaults to true.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limits the size of the result set.
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: If the response value next-offset exists, provide the value here to get the next
