  /websites/{websiteId}/publish:
    get:
      summary: Get website publishing history
      description: Returns list of publishing jobs for specified website.
      operationId: getPublishJobs
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Publish website
      description: Publishing puts the website on the Internet. This API creates a job that initiates
        and monitors the publishing process. Returns information about publishing the website, e.g., publishId,
        publishing status, etc. Then the website's publishing status can be polled via the publishId that's
        returned.
      operationId: createPublishJob
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      requestBody:
        description: Custom Vars
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomVars'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
