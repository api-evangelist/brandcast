  url: https://developer.brandcast.io/
tags:
- name: Websites
security:
- apiKeyHeader: []
paths:
  /websites:
    get:
      summary: Get websites
      description: Returns websites for this Brandcast account.
      operationId: getWebsites
      tags:
      - Websites
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create website from template
      description: Creates website from specified template and returns data for the newly created website.
        However, the website won't be available on the Internet until it's explicitly published.
      operationId: createWebsite
      tags:
      - Websites
      parameters:
      - name: templateId
        in: query
        description: Template ID
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Name of new website
        required: true
        schema:
          type: string
      - name: subdomain
        in: query
        description: Subdomain for new website
        required: true
        schema:
          type: string
      - name: newId
        in: query
        description: Optional new website ID
        required: false
        schema:
          type: string
      - name: description
        in: query
        description: Optional description for new website
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /websites/{websiteId}:
    get:
      summary: Get website
      description: Returns data for specified website.
      operationId: getWebsite
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
