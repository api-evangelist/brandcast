            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update website
      description: 'Updates a limited set of fields for a Website. Writable fields: description.'
      operationId: updateWebsite
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      requestBody:
        description: JSON body
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
            with {"message":"Missing Authentication Token"}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete website
      description: Deletes specified website, which means removing it from the Internet if it's already
        been published.
      operationId: deleteWebsite
      tags:
      - Websites
      parameters:
      - name: websiteId
        in: path
        description: Website ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: {}
        '403':
          description: Missing or invalid API key. The Brandcast API gateway answers unauthenticated requests
